<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mini Fazenda Isométrica 2.5D — In-Game OS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Camada de Renderização do Canvas Isométrico -->
    <div id="canvas-container">
      <canvas id="farm-canvas"></canvas>
    </div>

    <!-- Camada da Interface Desktop OS In-Game -->
    <div id="desktop-layer">
      <!-- Barra Superior / HUD -->
      <header id="top-bar">
        <div class="brand-section">
          <span class="brand-icon">🌾</span>
          <span>MINI FAZENDA ISO</span>
          <span class="hud-badge">v0.1.0-alpha</span>
        </div>

        <div class="hud-center">
          <div class="hud-badge hud-coins" id="hud-coins">💰 <strong>100</strong> Moedas</div>
          <div class="hud-badge" id="hud-tiles-count">Tiles: <strong>0</strong></div>
          <div class="hud-badge" id="hud-coord-hover">Cursor: <strong>(0, 0)</strong></div>
          <div class="hud-badge" id="hud-fps">FPS: <strong>60</strong></div>
        </div>

        <div class="hud-controls">
          <button class="hud-btn" id="btn-zoom-in" title="Aumentar Zoom">🔍 +</button>
          <button class="hud-btn" id="btn-zoom-out" title="Diminuir Zoom">🔍 -</button>
          <button class="hud-btn" id="btn-recenter" title="Centralizar Câmera na Fazenda">🎯 Centro</button>
          <button class="hud-btn" id="btn-toggle-grid" title="Ligar/Desligar Grade"># Grade</button>
          <button class="hud-btn" id="btn-open-editor" title="Abrir Editor de Código">📄 Editor</button>
          <button class="hud-btn" id="btn-open-guide" title="Manual de Tags">❓ Guia</button>
        </div>
      </header>

      <!-- Container de Janelas Flutuantes -->
      <div id="windows-container"></div>

      <!-- Barra de Tarefas Inferior (Taskbar) -->
      <footer id="taskbar">
        <button class="hud-btn" id="btn-start" style="font-weight: bold; background: rgba(56, 189, 248, 0.25);">
          🌱 Fazenda OS
        </button>
        <div id="taskbar-windows"></div>
        <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); padding-right: 8px;" id="system-clock">
          12:00:00
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
