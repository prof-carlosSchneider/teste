<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca – Demo Python</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--br:#e2e0d8;--ac:#1f5f4a;--ac2:#e8f1ed;--red:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--card:#222220;--tx:#eeede8;--mut:#a3a199;--br:#383733;--ac:#5fbf9f;--ac2:#1f2d28;--red:#f2877f}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 24px 0;max-width:1000px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:8px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.del{color:var(--red)}
main{max-width:1000px;margin:auto;padding:0 24px 40px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--ac2);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mut)}
form,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--br);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.bad{background:#b3261e22;color:var(--red)}
#msg{min-height:22px;color:var(--ac);font-size:14px;margin-bottom:8px}
h2{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>📚 Sistema de Biblioteca</h1>
  <div class="sub">Demonstração em Python (PyScript) · dados salvos no seu navegador</div>
  <nav id="nav"></nav>
</header>
<main><div id="msg"></div><div id="view">Carregando Python…</div></main>
<script type="py" src="./main.py"></script>
</body>
</html>
